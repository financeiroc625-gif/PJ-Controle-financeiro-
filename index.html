<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#059669">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>Controle Financeiro</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1b2433;--mut:#6b7686;--bd:#e3e8ef;--pri:#2563eb;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141c;--card:#18202c;--tx:#e8edf5;--mut:#92a0b3;--bd:#27313f;--pri:#4f8cff;--ok:#34d399;--bad:#f87171;--warn:#fbbf24}}
:root[data-theme="dark"]{--bg:#0f141c;--card:#18202c;--tx:#e8edf5;--mut:#92a0b3;--bd:#27313f;--pri:#4f8cff;--ok:#34d399;--bad:#f87171;--warn:#fbbf24}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
main{max-width:980px;margin:0 auto;padding:14px}
h1{font-size:18px;margin:0}h2{font-size:15px;margin:0 0 10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.mon{display:flex;align-items:center;gap:6px}
.mon b{min-width:130px;text-align:center;text-transform:capitalize}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(3,1fr)}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.kpi small{color:var(--mut);display:block}.kpi b{font-size:clamp(14px,3.6vw,22px)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mut{color:var(--mut)}
button,select,input{font:inherit;color:var(--tx)}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn.r{background:var(--bad)}
.ic{background:transparent;border:1px solid var(--bd);border-radius:8px;padding:5px 9px;cursor:pointer}
input,select{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px;width:100%}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.tx{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.tx:last-child{border:0}
.tx .i{flex:1;min-width:0}.tx .i b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .v{font-weight:700;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
.bar{height:9px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;font-size:28px;padding:0;box-shadow:0 4px 14px #0004;z-index:5}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:4}
nav button{flex:1;background:none;border:0;padding:10px 4px;color:var(--mut);cursor:pointer;font-size:12px}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--pri);font-weight:700}
dialog{border:0;border-radius:28px;background:var(--card);color:var(--tx);width:min(460px,94vw);padding:0;max-height:92vh;max-height:92dvh;overflow:hidden;box-shadow:0 8px 40px #0006}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:#0007}
.sh{overflow-y:auto;padding:4px 20px 8px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.hd{width:32px;height:4px;border-radius:2px;background:var(--mut);opacity:.4;margin:10px auto 8px;flex:none}
.ft{display:flex;gap:10px;padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--bd);flex:none}
.ft .btn{flex:1;border-radius:20px;padding:13px}
.amt{display:flex;align-items:center;justify-content:center;gap:6px;margin:14px 0 4px}
.amt span{font-size:22px;color:var(--mut)}
.amt input{font-size:40px;font-weight:700;text-align:center;border:0;border-bottom:2px solid var(--pri);border-radius:0;background:transparent;width:60%;padding:2px 0}
.amt input:focus{outline:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--bd);background:transparent;border-radius:10px;padding:8px 12px;cursor:pointer;font-size:14px}
.chip.on{background:color-mix(in srgb,var(--pri) 18%,transparent);border-color:var(--pri);color:var(--pri);font-weight:600}
.tip{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--mut);margin-top:10px}
.tip b{color:var(--tx)}
dialog .seg{border-radius:20px}
dialog .seg button{padding:11px}
dialog input{border-radius:12px;padding:12px}
@keyframes up{from{transform:translateY(100%)}}
@media(max-width:799px){dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:28px 28px 0 0;animation:up .25s ease-out}}
.seg{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:9px;cursor:pointer}
.seg button.on.e{background:var(--bad);color:#fff}.seg button.on.r{background:var(--ok);color:#fff}
.legend{display:flex;flex-direction:column;gap:6px;font-size:13px}
.legend div{display:flex;justify-content:space-between;gap:10px}
.donut{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.empty{text-align:center;color:var(--mut);padding:18px}
@media(min-width:800px){
 body{padding:0 0 0 200px}
 nav{top:0;right:auto;bottom:0;width:200px;flex-direction:column;border-top:0;border-right:1px solid var(--bd);padding:20px 10px}
 nav button{flex:none;text-align:left;display:flex;align-items:center;gap:10px;font-size:15px;padding:12px;border-radius:10px}
 nav button span{display:inline;font-size:18px}
 nav button.on{background:var(--bg)}
 .grid{grid-template-columns:1fr 1fr}
 .fab{bottom:24px;right:24px}
 main{padding:24px}
}
.hero{padding:16px}.hero small{color:var(--mut);display:block}.hero b{display:block;font-size:clamp(28px,9vw,40px);line-height:1.15;margin:2px 0}
.cts{font-size:.6em;font-weight:600;opacity:.65;display:inline!important;color:inherit!important}
.step{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--warn) 16%,var(--card));border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);border-radius:12px;padding:10px 12px;margin-bottom:12px;cursor:pointer}
.step div{flex:1}.step b,.step small{display:block}.step small{color:var(--mut);font-size:13px}
.dt{width:42px;flex:none;text-align:center;background:var(--bg);border-radius:8px;padding:4px 0}.dt b{display:block;font-size:16px}.dt small{font-size:10px;color:var(--mut)}
.kpis{grid-template-columns:repeat(2,1fr)!important}
.brand{display:flex;align-items:center;gap:8px}.brand img{height:34px;width:auto}
#cf{border:0;padding:0;background:transparent;max-width:none;overflow:visible;margin:auto}
#cf::backdrop{background:#0009;backdrop-filter:blur(3px)}
.bx{width:min(92vw,380px);background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:26px;padding:24px 20px 20px;text-align:center;box-shadow:0 20px 60px #0007;animation:pop .22s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.bx .ico{width:64px;height:64px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;font-size:30px;background:linear-gradient(#fb7185,#dc2626);box-shadow:0 5px 0 #991b1b,0 10px 18px #dc262655,inset 0 2px 0 #fff5}
.bx.i .ico{background:linear-gradient(#60a5fa,#2563eb);box-shadow:0 5px 0 #1e40af,0 10px 18px #2563eb55,inset 0 2px 0 #fff5}
.bx h3{margin:6px 0;font-size:18px}
.bx p{margin:0 0 16px;color:var(--mut);font-size:14px;line-height:1.45;white-space:pre-line}
.bx input{margin-bottom:16px;text-align:left}
.bt{display:flex;gap:12px;padding-bottom:5px}
.b4{flex:1;border:0;border-radius:16px;padding:13px 10px;font:inherit;font-weight:700;color:#fff;cursor:pointer;position:relative;top:0;transition:top .08s,box-shadow .08s;-webkit-tap-highlight-color:transparent;text-shadow:0 1px 0 #0004}
.b4.ok{background:linear-gradient(#4ade80,#16a34a);box-shadow:0 5px 0 #166534,0 9px 14px #16a34a55,inset 0 2px 0 #fff5}
.b4.bad{background:linear-gradient(#fb7185,#dc2626);box-shadow:0 5px 0 #991b1b,0 9px 14px #dc262655,inset 0 2px 0 #fff5}
.b4.no{background:linear-gradient(#f8fafc,#cbd5e1);color:#334155;text-shadow:none;box-shadow:0 5px 0 #94a3b8,0 9px 14px #0003,inset 0 2px 0 #fff}
.b4:active{top:4px;box-shadow:0 1px 0 #0006,0 3px 6px #0003}
@media(max-width:340px){.bt{flex-direction:column-reverse}}
/* cards: profundidade + contraste */
:root{--mut:#4b5565;--bd:#d3dbe6;--ok:#15803d;--bad:#b91c1c;--c1:#fff;--c2:#f6f8fb;--sh:0 1px 0 #fff inset,0 1px 2px #1b24331a,0 10px 22px -8px #1b243333;--kr1:#ecfdf5;--kr2:#d1fae5;--krb:#6ee7b7;--krt:#065f46;--krv:#064e3b;--kd1:#fff1f2;--kd2:#ffe4e6;--kdb:#fda4af;--kdt:#9f1239;--kdv:#881337;--hp1:#047857;--hp2:#064e3b;--hn1:#be123c;--hn2:#7f1230}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--mut:#aab6c8;--bd:#2e3a4d;--c1:#1e2837;--c2:#171f2b;--sh:0 1px 0 #ffffff14 inset,0 10px 24px -8px #000b;--kr1:#064e3b;--kr2:#053a2c;--krb:#10b98166;--krt:#a7f3d0;--krv:#6ee7b7;--kd1:#4c0d1c;--kd2:#3a0b16;--kdb:#fb718566;--kdt:#fecdd3;--kdv:#fda4af;--hp1:#065f46;--hp2:#022c22;--hn1:#9f1239;--hn2:#4c0519}}
:root[data-theme="dark"]{--mut:#aab6c8;--bd:#2e3a4d;--c1:#1e2837;--c2:#171f2b;--sh:0 1px 0 #ffffff14 inset,0 10px 24px -8px #000b;--kr1:#064e3b;--kr2:#053a2c;--krb:#10b98166;--krt:#a7f3d0;--krv:#6ee7b7;--kd1:#4c0d1c;--kd2:#3a0b16;--kdb:#fb718566;--kdt:#fecdd3;--kdv:#fda4af;--hp1:#065f46;--hp2:#022c22;--hn1:#9f1239;--hn2:#4c0519}
.card,.kpi,.step{box-shadow:var(--sh);transition:transform .15s,box-shadow .15s}
.card{background:linear-gradient(180deg,var(--c1),var(--c2));border-color:var(--bd);border-radius:18px}
.kpis{gap:12px}
.kpi{border-radius:18px;padding:14px;overflow-wrap:anywhere}
.kpi small{font-weight:600}
.kpi b{font-size:clamp(16px,4.6vw,24px)}
.kpi:has(b.ok){background:linear-gradient(145deg,var(--kr1),var(--kr2));border-color:var(--krb)}
.kpi:has(b.ok) small{color:var(--krt)}.kpi:has(b.ok) b{color:var(--krv)}
.kpi:has(b.bad){background:linear-gradient(145deg,var(--kd1),var(--kd2));border-color:var(--kdb)}
.kpi:has(b.bad) small{color:var(--kdt)}.kpi:has(b.bad) b{color:var(--kdv)}
.hero{position:relative;overflow:hidden;border:0;border-radius:22px;padding:20px;color:#fff}
.hero:has(b.ok){background:linear-gradient(145deg,var(--hp1),var(--hp2))}
.hero:has(b.bad){background:linear-gradient(145deg,var(--hn1),var(--hn2))}
.hero small,.hero b{color:#fff!important}.hero small{opacity:.92;font-weight:600}
.hero::after{content:"";position:absolute;right:-36px;top:-36px;width:150px;height:150px;border-radius:50%;background:radial-gradient(#ffffff3d,transparent 70%);pointer-events:none}
@media(max-width:360px){.kpis{grid-template-columns:1fr!important}}
@media(min-width:800px){.hero{padding:26px}.kpis,.grid{gap:16px}}
@media(hover:hover){.card:hover,.kpi:hover{transform:translateY(-2px)}}
#cf{width:auto;max-width:none;max-height:none;box-shadow:none;border-radius:0;animation:none;margin:auto}
#cf[open]{display:block}
.bx{margin:0 auto}
.bx.info .ico,.bx.ask .ico{background:linear-gradient(#60a5fa,#2563eb);box-shadow:0 5px 0 #1e40af,0 10px 18px #2563eb55,inset 0 2px 0 #fff5}
.bx.ok .ico{background:linear-gradient(#4ade80,#16a34a);box-shadow:0 5px 0 #166534,0 10px 18px #16a34a55,inset 0 2px 0 #fff5}
.bx.warn .ico{background:linear-gradient(#fbbf24,#d97706);box-shadow:0 5px 0 #92400e,0 10px 18px #d9770655,inset 0 2px 0 #fff5}
.b4.info{background:linear-gradient(#60a5fa,#1d4ed8);box-shadow:0 5px 0 #1e3a8a,0 9px 14px #2563eb55,inset 0 2px 0 #fff5}
.b4.warn{background:linear-gradient(#d97706,#92400e);box-shadow:0 5px 0 #78350f,0 9px 14px #d9770655,inset 0 2px 0 #fff5}
.b4.info:active,.b4.warn:active{top:4px;box-shadow:0 1px 0 #0006,0 3px 6px #0003}
/* botoes 3D */
:root{--g1:#fff;--g2:#e9eef5;--g3:#b4c0d0}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--g1:#2b3749;--g2:#202a39;--g3:#0a0f16}}
:root[data-theme="dark"]{--g1:#2b3749;--g2:#202a39;--g3:#0a0f16}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn,.ic,.chip,.fab,nav button.on{transition:transform .08s,box-shadow .08s,filter .15s}
.btn{border-radius:14px;padding:11px 16px;min-height:44px;color:#fff;text-shadow:0 1px 0 #0003;background:linear-gradient(#5b9bff,#2563eb);box-shadow:0 5px 0 #1e40af,0 10px 16px #2563eb44,inset 0 2px 0 #ffffff55;margin-bottom:5px}
.btn.g{color:var(--tx);text-shadow:none;border:1px solid var(--bd);background:linear-gradient(var(--g1),var(--g2));box-shadow:0 5px 0 var(--g3),0 10px 16px #0002,inset 0 2px 0 #ffffff66}
.btn.r{background:linear-gradient(#fb7185,#dc2626);box-shadow:0 5px 0 #991b1b,0 10px 16px #dc262644,inset 0 2px 0 #ffffff55}
.btn.pdf{background:linear-gradient(#818cf8,#4f46e5);box-shadow:0 5px 0 #3730a3,0 10px 16px #4f46e544,inset 0 2px 0 #ffffff55}
.btn:active,.fab:active{transform:translateY(4px)}
.btn:active{box-shadow:0 1px 0 #0007,0 3px 6px #0003,inset 0 2px 0 #ffffff33}
.btn.g:active{box-shadow:0 1px 0 var(--g3),0 3px 6px #0002}
.fab{background:linear-gradient(#5b9bff,#2563eb);box-shadow:0 6px 0 #1e40af,0 12px 20px #2563eb66,inset 0 2px 0 #ffffff55}
.fab:active{box-shadow:0 2px 0 #1e40af,0 4px 8px #2563eb55}
.ic{min-width:38px;min-height:38px;border-radius:11px;color:var(--tx);background:linear-gradient(var(--g1),var(--g2));box-shadow:0 3px 0 var(--g3),0 5px 8px #0002,inset 0 1px 0 #ffffff66;margin-bottom:3px}
.ic:active{transform:translateY(2px);box-shadow:0 1px 0 var(--g3)}
.chip{border-radius:12px;color:var(--tx);background:linear-gradient(var(--g1),var(--g2));box-shadow:0 3px 0 var(--g3),inset 0 1px 0 #ffffff66;margin-bottom:3px}
.chip.on{color:#fff;border-color:transparent;background:linear-gradient(#5b9bff,#2563eb);box-shadow:0 3px 0 #1e40af,inset 0 1px 0 #ffffff55}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--g3)}
.seg{box-shadow:0 3px 0 var(--g3);background:linear-gradient(var(--g1),var(--g2))}
nav button{border-radius:14px;margin:6px 3px}
nav button.on{background:linear-gradient(var(--g1),var(--g2));box-shadow:0 3px 0 var(--g3),0 5px 8px #0002}
@media(max-width:380px){.btn{padding:10px 12px;font-size:14px}.chip{padding:7px 10px;font-size:13px}}
@media(hover:hover){.btn:hover,.chip:hover,.ic:hover{filter:brightness(1.06)}}
</style>

<nav id="nav"></nav>
<main id="app"></main>
<button class="btn fab" onclick="openForm()" aria-label="Novo lançamento">+</button>

<script>
const KEY='controle_financeiro_v1';
const COLORS=['#2563eb','#16a34a','#d97706','#dc2626','#9333ea','#0891b2','#db2777','#65a30d','#ea580c','#64748b'];
const def=()=>({tx:[],budgets:{},cats:{e:['Moradia','Alimentação','Transporte','Saúde','Lazer','Educação','Contas','Outros'],r:['Salário','Extra','Investimentos','Outros']}});
let S=load(),mon=new Date().toISOString().slice(0,7),view='painel',q='',ft='';
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.tx)return d}catch(e){}return def()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s);
let HID=false;try{HID=localStorage.getItem(KEY+'_hide')=='1'}catch(e){}
function toggleHide(){HID=!HID;try{localStorage.setItem(KEY+'_hide',HID?'1':'0')}catch(e){}render()}
const brl=v=>HID?'R$ ••••':(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const big=v=>{if(HID)return 'R$ ••••';const s=(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),i=s.lastIndexOf(',');return s.slice(0,i)+'<small class="cts">'+s.slice(i)+'</small>'};
const MES=['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
function prox(){
 const t0=new Date();t0.setHours(0,0,0,0);const l0=new Date(t0);l0.setDate(l0.getDate()+30);
 const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
 const a=iso(t0),b=iso(l0),L=[],seen=new Set(),E=S.tx.filter(x=>x.t=='e');
 E.filter(x=>x.d>a&&x.d<=b).forEach(x=>{L.push({d:x.d,n:x.n||x.c,v:x.v,s:'agendado'});seen.add((x.n||'').trim().toLowerCase()+'|'+x.d.slice(0,7))});
 const g={};E.filter(x=>x.n&&x.d<=a).forEach(x=>{const k=x.n.trim().toLowerCase();(g[k]=g[k]||[]).push(x)});
 Object.entries(g).forEach(([k,A])=>{if(new Set(A.map(x=>x.d.slice(0,7))).size<2)return;A.sort((p,q)=>p.d.localeCompare(q.d));
  const l=A[A.length-1],[y,m,dd]=l.d.split('-').map(Number),dim=new Date(y,m+1,0).getDate(),nd=iso(new Date(y,m,Math.min(dd,dim)));
  if(nd>a&&nd<=b&&!seen.has(k+'|'+nd.slice(0,7)))L.push({d:nd,n:l.n,v:l.v,s:'recorrente'})});
 L.forEach(o=>o.k=Math.round((new Date(o.d+'T00:00:00')-t0)/864e5));
 return L.sort((p,q)=>p.d.localeCompare(q.d)).slice(0,6)}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=d=>d.split('-').reverse().join('/');
const sum=a=>a.reduce((s,t)=>s+t.v,0);
const mtx=m=>S.tx.filter(t=>t.d.startsWith(m));
const color=c=>COLORS[[...S.cats.e,...S.cats.r].indexOf(c)%COLORS.length]||COLORS[9];
function shift(n){const[y,m]=mon.split('-').map(Number);const d=new Date(y,m-1+n,1);mon=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');render()}
function monLabel(m){return new Date(m+'-15').toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}
function setView(v){view=v;render()}

function render(){

function vPainel(){
 const t=mtx(mon),r=sum(t.filter(x=>x.t=='r')),e=sum(t.filter(x=>x.t=='e')),s=r-e;
 const[y,m]=mon.split('-').map(Number);
 const by={};t.filter(x=>x.t=='e').forEach(x=>by[x.c]=(by[x.c]||0)+x.v);
 const cats=Object.entries(by).sort((a,b)=>b[1]-a[1]);
 const pm=(()=>{const d=new Date(y,m-2,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')})();
 const px=mtx(pm),pe=sum(px.filter(x=>x.t=='e')),ps=sum(px.filter(x=>x.t=='r'))-pe;
 const dvv=e&&pe?Math.round((e-pe)/pe*100):null;
 const ctr=`<text x="21" y="${dvv==null?22.2:20.6}" font-size="3.3" font-weight="700" text-anchor="middle" fill="var(--tx)">${brl(e)}</text>`+(dvv==null?'':`<text x="21" y="25.2" font-size="2.1" text-anchor="middle" fill="${dvv>0?'var(--bad)':'var(--ok)'}">${dvv>0?'▲':'▼'} ${Math.abs(dvv)}% vs. mês ant.</text>`);
 let off=0;
 const arcs=cats.map(([c,v])=>{const p=v/e*100;const s=`<circle r="15.9155" cx="21" cy="21" fill="none" stroke="${color(c)}" stroke-width="6" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${-off}" transform="rotate(-90 21 21)"/>`;off+=p;return s}).join('');
 const donut=e?`<div class="donut"><svg viewBox="0 0 42 42" width="150" height="150"><circle r="15.9155" cx="21" cy="21" fill="none" stroke="var(--bd)" stroke-width="6"/>${arcs}<!--C--></svg><div class="legend" style="flex:1;min-width:150px">${cats.map(([c,v])=>`<div><span><i class="dot" style="background:${color(c)}"></i>${esc(c)}</span><b>${brl(v)} <small class="mut">${Math.round(v/e*100)}%</small></b></div>`).join('')}</div></div>`:'<div class="empty">Sem despesas neste mês</div>';
 // últimos 6 meses
 const ms=[];
 for(let i=5;i>=0;i--){const d=new Date(y,m-1-i,1);const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');const x=mtx(k);ms.push({k,l:d.toLocaleDateString('pt-BR',{month:'short'}).replace('.',''),r:sum(x.filter(a=>a.t=='r')),e:sum(x.filter(a=>a.t=='e'))})}
 const mx=Math.max(1,...ms.flatMap(a=>[a.r,a.e]));
 const bars=ms.map((a,i)=>{const x=i*50+8,hr=a.r/mx*100,he=a.e/mx*100;return `<rect x="${x}" y="${110-hr}" width="16" height="${hr}" rx="3" fill="var(--ok)"/><rect x="${x+18}" y="${110-he}" width="16" height="${he}" rx="3" fill="var(--bad)"/><text x="${x+17}" y="128" font-size="10" text-anchor="middle" fill="var(--mut)">${a.l}</text>`}).join('');
 const last=[...t].sort((a,b)=>b.d.localeCompare(a.d)).slice(0,5);
 const ins=[];
 if(e&&pe){const dv=Math.round((e-pe)/pe*100);ins.push(`Você gastou <b>${Math.abs(dv)}% ${dv>=0?'a mais':'a menos'}</b> que no mês anterior.`)}
 if(cats[0])ins.push(`Maior gasto: <b>${esc(cats[0][0])}</b> (${brl(cats[0][1])}).`);
 if(r&&e)ins.push(`Você comprometeu <b>${Math.round(e/r*100)}%</b> da renda.`);
 const rc={};S.tx.filter(x=>x.t=='e'&&x.n).forEach(x=>{const k=x.n.trim().toLowerCase();(rc[k]=rc[k]||{n:x.n,ms:new Set(),v:0}).ms.add(x.d.slice(0,7));rc[k].v=x.v});
 const rec=Object.values(rc).filter(o=>o.ms.size>=2&&o.ms.has(mon)).slice(0,5);
 const insH=(ins.length||rec.length)?`<div class="card"><h2>💡 Resumo do mês</h2>${ins.map(i=>`<p style="margin:4px 0">${i}</p>`).join('')}${rec.length?`<p class="mut" style="margin:10px 0 4px">🔁 Parecem recorrentes: ${rec.map(o=>`${esc(o.n)} (${brl(o.v)})`).join(', ')}</p>`:''}</div>`:'';
 const PX=prox();
 const ov=Object.entries(S.budgets||{}).map(([c,l])=>[c,+l||0,by[c]||0]).filter(a=>a[1]>0&&a[2]>=a[1]*.8).sort((a,b)=>b[2]/b[1]-a[2]/a[1])[0];
 let nx=null;
 if(ov)nx=[ov[2]>=ov[1]?`Orçamento de ${esc(ov[0])} estourou em ${brl(ov[2]-ov[1])}`:`${esc(ov[0])} já usou ${Math.round(ov[2]/ov[1]*100)}% do limite`,'orc'];
 else if(PX[0]&&PX[0].k<=3)nx=[`${esc(PX[0].n)} ${PX[0].k<1?'vence hoje':PX[0].k==1?'vence amanhã':'vence em '+PX[0].k+' dias'} (${brl(PX[0].v)})`,'lanc'];
 const stepH=nx?`<div class="step" onclick="setView('${nx[1]}')"><span>🔔</span><div><b>Próximo passo</b><small>${nx[0]}</small></div><span class="mut">›</span></div>`:'';
 const pxH=PX.length?`<div class="card"><h2>📅 Próximos 30 dias <small class="mut">compromissos já conhecidos</small></h2>${PX.map(o=>`<div class="tx"><div class="dt"><b>${o.d.slice(8)}</b><small>${MES[+o.d.slice(5,7)-1]}</small></div><div class="i"><b>${esc(o.n)}</b><small class="mut">${o.s}</small></div><span class="v bad">-${brl(o.v)}</span></div>`).join('')}</div>`:'';
 return `${stepH}<div class="card hero"><small>Saldo do mês</small><b class="${s>=0?'ok':'bad'}">${big(s)}</b><small>${pe||ps?'Mês anterior: '+brl(ps):'Sem dados do mês anterior'}</small></div>
 <div class="kpis"><div class="kpi"><small>↙ Receitas</small><b class="ok">${big(r)}</b></div><div class="kpi"><small>↗ Despesas</small><b class="bad">${big(e)}</b></div></div>
 <div style="height:12px"></div>${insH}${pxH}<div class="grid"><div class="card"><h2>Despesas por categoria</h2>${donut.replace('<!--C-->',ctr)}</div>
 <div class="card"><h2>Últimos 6 meses <small class="mut">(<span class="ok">receitas</span> / <span class="bad">despesas</span>)</small></h2><svg viewBox="0 0 300 135" width="100%">${bars}</svg></div></div>
 <div class="card"><h2>Últimos lançamentos</h2>${last.length?last.map(txRow).join(''):'<div class="empty">Nenhum lançamento</div>'}</div>`;
}

function impCalc(){const ex=new Set(S.tx.map(x=>[x.d,x.v.toFixed(2),x.t,(x.n||'').toLowerCase()].join('|')));IM.rows.forEach(r=>{r.t=(IM.mode=='b'?r.raw<0:r.raw>0)?'e':'r';r.v=Math.abs(r.raw);r.c=guess(r.n,r.t);r.dup=ex.has([r.d,r.v.toFixed(2),r.t,r.n.toLowerCase()].join('|'));r.ok=!r.dup})}
function impRender(k){if(!k)impCalc();const R=IM.rows;
 $('#dlg').innerHTML=`<div class="hd"></div><div class="sh"><h2>Importar extrato (${R.length})</h2>
 <label>Como interpretar os valores</label><select onchange="IM.mode=this.value;impRender()"><option value="b" ${IM.mode=='b'?'selected':''}>Negativo = despesa (extrato do banco)</option><option value="c" ${IM.mode=='c'?'selected':''}>Positivo = despesa (fatura do cartão)</option></select>
 <p class="mut" style="font-size:13px">Categorias sugeridas automaticamente; você pode editar depois. Lançamentos parecidos com os já existentes vêm desmarcados.</p>
 <div class="chips" style="margin-bottom:6px"><button class="chip" onclick="IM.rows.forEach(r=>r.ok=true);impRender(1)">Marcar todos</button><button class="chip" onclick="IM.rows.forEach(r=>r.ok=false);impRender(1)">Desmarcar todos</button></div><div>${R.map((r,i)=>`<div class="tx"><input type="checkbox" style="width:22px;height:22px;flex:none;padding:0" ${r.ok?'checked':''} onchange="IM.rows[${i}].ok=this.checked;impSum()"><div class="i"><b>${esc(r.n||'(sem descrição)')}</b><small class="mut">${fd(r.d)} · ${esc(r.c)}${r.dup?' · ⚠️ já lançado?':''}</small></div><span class="v ${r.t=='r'?'ok':'bad'}">${r.t=='r'?'+':'-'}${brl(r.v)}</span></div>`).join('')}</div></div>
 <div class="ft"><button class="btn g" onclick="$('#dlg').close()">Cancelar</button><button class="btn" id="impb" onclick="impDo()"></button></div>`;impSum()}
function impSum(){$('#impb').textContent='Importar '+IM.rows.filter(r=>r.ok).length}
function impDo(){const sel=IM.rows.filter(r=>r.ok);if(!sel.length)return;sel.forEach(r=>S.tx.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),t:r.t,v:r.v,n:r.n,c:r.c,d:r.d,p:IM.mode=='c'?'Crédito':'Débito'}));save();mon=sel.map(r=>r.d).sort().pop().slice(0,7);$('#dlg').close();render();askInfo(sel.length+(sel.length>1?' lançamentos importados':' lançamento importado')+' com sucesso.','ok')}
$('#ext').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const buf=await f.arrayBuffer();let rows=[];try{if(/\.pdf$/i.test(f.name)){rows=parseStmt(await pdfText(buf))}else{let txt;try{txt=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(x){txt=new TextDecoder('windows-1252').decode(buf)}const tt=/\.txt$/i.test(f.name);rows=tt?parseStmt(txt):parseExt(txt);if(!rows.length)rows=tt?parseExt(txt):parseStmt(txt)}}catch(x){askInfo('Não consegui ler o PDF (é preciso internet para carregar o leitor). Tente exportar em CSV/OFX ou salvar o texto do extrato em um arquivo .txt.','err');return}if(!rows.length){askInfo('Não encontrei lançamentos neste arquivo. Use um extrato em PDF, CSV ou OFX.');return}IM={rows,mode:'b'};impRender();$('#dlg').showModal()};
$('#dlg').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close()});

if(window.visualViewport){const vv=visualViewport,f=()=>{const d=$('#dlg'),kb=innerHeight-vv.height-vv.offsetTop;d.style.maxHeight=kb>80?Math.round(vv.height*.96)+'px':'';d.style.marginBottom=kb>80?kb+'px':''};vv.addEventListener('resize',f);vv.addEventListener('scroll',f)}
render();
