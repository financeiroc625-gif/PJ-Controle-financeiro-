<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Controle Financeiro</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1b2433;--mut:#6b7686;--bd:#e3e8ef;--pri:#2563eb;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141c;--card:#18202c;--tx:#e8edf5;--mut:#92a0b3;--bd:#27313f;--pri:#4f8cff;--ok:#34d399;--bad:#f87171;--warn:#fbbf24}}
:root[data-theme="dark"]{--bg:#0f141c;--card:#18202c;--tx:#e8edf5;--mut:#92a0b3;--bd:#27313f;--pri:#4f8cff;--ok:#34d399;--bad:#f87171;--warn:#fbbf24}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
main{max-width:980px;margin:0 auto;padding:14px}
h1{font-size:18px;margin:0}h2{font-size:15px;margin:0 0 10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.mon{display:flex;align-items:center;gap:6px}
.mon b{min-width:130px;text-align:center;text-transform:capitalize}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(3,1fr)}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.kpi small{color:var(--mut);display:block}.kpi b{font-size:clamp(14px,3.6vw,22px)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mut{color:var(--mut)}
button,select,input{font:inherit;color:var(--tx)}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn.r{background:var(--bad)}
.ic{background:transparent;border:1px solid var(--bd);border-radius:8px;padding:5px 9px;cursor:pointer}
input,select{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px;width:100%}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.tx{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.tx:last-child{border:0}
.tx .i{flex:1;min-width:0}.tx .i b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .v{font-weight:700;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
.bar{height:9px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;font-size:28px;padding:0;box-shadow:0 4px 14px #0004;z-index:5}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:4}
nav button{flex:1;background:none;border:0;padding:10px 4px;color:var(--mut);cursor:pointer;font-size:12px}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--pri);font-weight:700}
dialog{border:0;border-radius:28px;background:var(--card);color:var(--tx);width:min(460px,94vw);padding:0;max-height:92vh;max-height:92dvh;overflow:hidden;box-shadow:0 8px 40px #0006}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:#0007}
.sh{overflow-y:auto;padding:4px 20px 8px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.hd{width:32px;height:4px;border-radius:2px;background:var(--mut);opacity:.4;margin:10px auto 8px;flex:none}
.ft{display:flex;gap:10px;padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--bd);flex:none}
.ft .btn{flex:1;border-radius:20px;padding:13px}
.amt{display:flex;align-items:center;justify-content:center;gap:6px;margin:14px 0 4px}
.amt span{font-size:22px;color:var(--mut)}
.amt input{font-size:40px;font-weight:700;text-align:center;border:0;border-bottom:2px solid var(--pri);border-radius:0;background:transparent;width:60%;padding:2px 0}
.amt input:focus{outline:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--bd);background:transparent;border-radius:10px;padding:8px 12px;cursor:pointer;font-size:14px}
.chip.on{background:color-mix(in srgb,var(--pri) 18%,transparent);border-color:var(--pri);color:var(--pri);font-weight:600}
.tip{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--mut);margin-top:10px}
.tip b{color:var(--tx)}
dialog .seg{border-radius:20px}
dialog .seg button{padding:11px}
dialog input{border-radius:12px;padding:12px}
@keyframes up{from{transform:translateY(100%)}}
@media(max-width:799px){dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:28px 28px 0 0;animation:up .25s ease-out}}
.seg{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:9px;cursor:pointer}
.seg button.on.e{background:var(--bad);color:#fff}.seg button.on.r{background:var(--ok);color:#fff}
.legend{display:flex;flex-direction:column;gap:6px;font-size:13px}
.legend div{display:flex;justify-content:space-between;gap:10px}
.donut{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.empty{text-align:center;color:var(--mut);padding:18px}
@media(min-width:800px){
 body{padding:0 0 0 200px}
 nav{top:0;right:auto;bottom:0;width:200px;flex-direction:column;border-top:0;border-right:1px solid var(--bd);padding:20px 10px}
 nav button{flex:none;text-align:left;display:flex;align-items:center;gap:10px;font-size:15px;padding:12px;border-radius:10px}
 nav button span{display:inline;font-size:18px}
 nav button.on{background:var(--bg)}
 .grid{grid-template-columns:1fr 1fr}
 .fab{bottom:24px;right:24px}
 main{padding:24px}
}
.brand{display:flex;align-items:center;gap:8px}.brand img{height:34px;width:auto}
</style>
</head>
<body>
<nav id="nav"></nav>
<main id="app"></main>
<button class="btn fab" onclick="openForm()" aria-label="Novo lançamento">+</button>

<input type="file" id="imp" accept=".json" hidden>
<input type="file" id="ext" accept=".pdf,.csv,.ofx,.txt" hidden>

function vPainel(){
 const t=mtx(mon),r=sum(t.filter(x=>x.t=='r')),e=sum(t.filter(x=>x.t=='e')),s=r-e;
 const by={};t.filter(x=>x.t=='e').forEach(x=>by[x.c]=(by[x.c]||0)+x.v);
 const cats=Object.entries(by).sort((a,b)=>b[1]-a[1]);
 let off=0;
 const arcs=cats.map(([c,v])=>{const p=v/e*100;const s=`<circle r="15.9155" cx="21" cy="21" fill="none" stroke="${color(c)}" stroke-width="6" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${-off}" transform="rotate(-90 21 21)"/>`;off+=p;return s}).join('');
 const donut=e?`<div class="donut"><svg viewBox="0 0 42 42" width="150" height="150"><circle r="15.9155" cx="21" cy="21" fill="none" stroke="var(--bd)" stroke-width="6"/>${arcs}</svg><div class="legend" style="flex:1;min-width:150px">${cats.map(([c,v])=>`<div><span><i class="dot" style="background:${color(c)}"></i>${esc(c)}</span><b>${brl(v)} <small class="mut">${Math.round(v/e*100)}%</small></b></div>`).join('')}</div></div>`:'<div class="empty">Sem despesas neste mês</div>';
 // últimos 6 meses
 const ms=[];const[y,m]=mon.split('-').map(Number);
 for(let i=5;i>=0;i--){const d=new Date(y,m-1-i,1);const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');const x=mtx(k);ms.push({k,l:d.toLocaleDateString('pt-BR',{month:'short'}).replace('.',''),r:sum(x.filter(a=>a.t=='r')),e:sum(x.filter(a=>a.t=='e'))})}
 const mx=Math.max(1,...ms.flatMap(a=>[a.r,a.e]));
 const bars=ms.map((a,i)=>{const x=i*50+8,hr=a.r/mx*100,he=a.e/mx*100;return `<rect x="${x}" y="${110-hr}" width="16" height="${hr}" rx="3" fill="var(--ok)"/><rect x="${x+18}" y="${110-he}" width="16" height="${he}" rx="3" fill="var(--bad)"/><text x="${x+17}" y="128" font-size="10" text-anchor="middle" fill="var(--mut)">${a.l}</text>`}).join('');
 const last=[...t].sort((a,b)=>b.d.localeCompare(a.d)).slice(0,5);
 const pm=(()=>{const d=new Date(y,m-2,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')})();
 const pe=sum(mtx(pm).filter(x=>x.t=='e')),ins=[];
 if(e&&pe){const dv=Math.round((e-pe)/pe*100);ins.push(`Você gastou <b>${Math.abs(dv)}% ${dv>=0?'a mais':'a menos'}</b> que no mês anterior.`)}
 if(cats[0])ins.push(`Maior gasto: <b>${esc(cats[0][0])}</b> (${brl(cats[0][1])}).`);
 if(r&&e)ins.push(`Você comprometeu <b>${Math.round(e/r*100)}%</b> da renda.`);
 const rc={};S.tx.filter(x=>x.t=='e'&&x.n).forEach(x=>{const k=x.n.trim().toLowerCase();(rc[k]=rc[k]||{n:x.n,ms:new Set(),v:0}).ms.add(x.d.slice(0,7));rc[k].v=x.v});
 const rec=Object.values(rc).filter(o=>o.ms.size>=2&&o.ms.has(mon)).slice(0,5);
 const insH=(ins.length||rec.length)?`<div class="card"><h2>💡 Resumo do mês</h2>${ins.map(i=>`<p style="margin:4px 0">${i}</p>`).join('')}${rec.length?`<p class="mut" style="margin:10px 0 4px">🔁 Parecem recorrentes: ${rec.map(o=>`${esc(o.n)} (${brl(o.v)})`).join(', ')}</p>`:''}</div>`:'';
 return `<div class="kpis"><div class="kpi"><small>Receitas</small><b class="ok">${brl(r)}</b></div><div class="kpi"><small>Despesas</small><b class="bad">${brl(e)}</b></div><div class="kpi"><small>Saldo</small><b class="${s>=0?'ok':'bad'}">${brl(s)}</b></div></div>
 <div style="height:12px"></div>${insH}<div class="grid"><div class="card"><h2>Despesas por categoria</h2>${donut}</div>
 <div class="card"><h2>Últimos 6 meses <small class="mut">(<span class="ok">receitas</span> / <span class="bad">despesas</span>)</small></h2><svg viewBox="0 0 300 135" width="100%">${bars}</svg></div></div>
 <div class="card"><h2>Últimos lançamentos</h2>${last.length?last.map(txRow).join(''):'<div class="empty">Nenhum lançamento</div>'}</div>`;
}

function txRow(t){return `<div class="tx"><i class="dot" style="background:${color(t.c)}"></i><div class="i"><b>${esc(t.n||t.c)}</b><small class="mut">${fd(t.d)} · ${esc(t.c)} · ${esc(t.p||'')}</small></div><span class="v ${t.t=='r'?'ok':'bad'}">${t.t=='r'?'+':'-'}${brl(t.v)}</span><button class="ic" onclick="openForm('${t.id}')">✏️</button><button class="ic" onclick="del('${t.id}')">🗑️</button></div>`}

function vLanc(){
 let t=mtx(mon).filter(x=>(!ft||x.t==ft)&&(!q||(x.n+x.c).toLowerCase().includes(q.toLowerCase())));
 t.sort((a,b)=>b.d.localeCompare(a.d));
 return `<div class="card"><div class="row"><input placeholder="Buscar..." value="${esc(q)}" oninput="q=this.value;keep()"><select onchange="ft=this.value;render()"><option value="">Todos</option><option value="e" ${ft=='e'?'selected':''}>Despesas</option><option value="r" ${ft=='r'?'selected':''}>Receitas</option></select></div></div>
 <div class="card" id="list">${listHtml(t)}</div>`;
}
function listHtml(t){return t.length?t.map(txRow).join('')+`<p class="mut" style="text-align:right;margin:10px 0 0">Total filtrado: <b>${brl(sum(t.filter(x=>x.t=='r'))-sum(t.filter(x=>x.t=='e')))}</b></p>`:'<div class="empty">Nenhum lançamento encontrado</div>'}
function keep(){const t=mtx(mon).filter(x=>(!ft||x.t==ft)&&(!q||(x.n+x.c).toLowerCase().includes(q.toLowerCase()))).sort((a,b)=>b.d.localeCompare(a.d));$('#list').innerHTML=listHtml(t)}

function vOrc(){
 const t=mtx(mon).filter(x=>x.t=='e');
 return `<div class="card"><h2>Limite mensal por categoria</h2>${S.cats.e.map(c=>{const g=sum(t.filter(x=>x.c==c)),l=+S.budgets[c]||0,p=l?g/l*100:0,col=p>=100?'var(--bad)':p>=80?'var(--warn)':'var(--ok)';
 return `<div style="margin-bottom:14px"><div class="row" style="margin-bottom:5px"><span><i class="dot" style="background:${color(c)}"></i>${esc(c)}</span><input type="number" min="0" step="10" placeholder="Limite R$" value="${l||''}" onchange="setB('${esc(c)}',this.value)" style="max-width:130px"></div><div class="bar"><i style="width:${Math.min(p,100)}%;background:${col}"></i></div><small class="mut">${brl(g)}${l?` de ${brl(l)} · ${Math.round(p)}%${p>100?' ⚠️ estourou '+brl(g-l):''}`:' · sem limite'}</small></div>`}).join('')}</div>`;
}
function setB(c,v){S.budgets[c]=+v||0;save();render()}

function vCfg(){
 return `<div class="card"><h2>Categorias</h2><p class="mut" style="margin:0 0 10px">Toque em ✎ para editar a dica que aparece ao lançar.</p><div class="row"><input id="nc" placeholder="Nova categoria"><select id="nt"><option value="e">Despesa</option><option value="r">Receita</option></select><button class="btn" style="flex:none" onclick="addCat()">Adicionar</button></div>
 ${['e','r'].map(k=>`<p class="mut" style="margin:12px 0 4px">${k=='e'?'Despesas':'Receitas'}</p>${S.cats[k].map(c=>`<span class="ic" style="display:inline-block;margin:0 6px 6px 0"><i class="dot" style="background:${color(c)}"></i>${esc(c)} <a href="#" onclick="editHint('${k}','${esc(c)}');return false" style="text-decoration:none">✎</a> <a href="#" onclick="rmCat('${k}','${esc(c)}');return false" style="color:var(--bad);text-decoration:none">✕</a></span>`).join('')}`).join('')}</div>
 <div class="card"><h2>Dados</h2><div class="row" style="flex-wrap:wrap"><button class="btn g" onclick="exportJSON()">⬇️ Backup (JSON)</button><button class="btn g" onclick="exportCSV()">⬇️ Exportar CSV</button><button class="btn g" onclick="$('#imp').click()">⬆️ Importar backup</button><button class="btn g" onclick="$('#ext').click()">📥 Importar extrato (PDF/CSV/OFX)</button></div>
 <p class="mut">Os dados ficam salvos somente neste navegador. Faça backup regularmente.</p><button class="btn r" onclick="reset()">Apagar todos os dados</button></div>
 <div class="card"><h2>Tema</h2><div class="seg"><button onclick="theme('')">Auto</button><button onclick="theme('light')">Claro</button><button onclick="theme('dark')">Escuro</button></div></div>`;
}
function theme(t){if(t)document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme}
function editHint(k,c){const v=prompt('Dica para "'+c+'" (deixe vazio para restaurar o padrão):',hint(k,c)[1]);if(v===null)return;S.hints=S.hints||{};const key=k+'|'+c;if(v.trim())S.hints[key]=v.trim();else delete S.hints[key];save();render()}
function addCat(){const n=$('#nc').value.trim(),k=$('#nt').value;if(!n||S.cats[k].includes(n))return;S.cats[k].push(n);save();render()}
function rmCat(k,c){if(S.tx.some(t=>t.c==c)&&!confirm('Existem lançamentos nesta categoria. Remover mesmo assim?'))return;S.cats[k]=S.cats[k].filter(x=>x!=c);save();render()}

const HINT={e:{'Moradia':['🏠','Aluguel, financiamento, condomínio, IPTU, reformas e manutenção da casa.'],'Alimentação':['🍽️','Supermercado, feira, padaria, restaurantes, lanches e delivery.'],'Transporte':['🚗','Combustível, ônibus, aplicativos, pedágio, estacionamento e manutenção do veículo.'],'Saúde':['💊','Plano de saúde, consultas, exames, remédios e farmácia.'],'Lazer':['🎉','Cinema, viagens, streaming, bares, passeios e hobbies.'],'Educação':['📚','Mensalidade, cursos, livros, material escolar e idiomas.'],'Contas':['🧾','Água, internet, telefone, gás e outras contas fixas.'],'Energia':['💡','Conta de luz e energia elétrica.'],'Cartão de Crédito':['💳','Pagamento da fatura do cartão. Não lance as compras de novo, para não duplicar.'],'Outros':['📦','Gastos que não se encaixam nas outras categorias.']},r:{'Salário':['💼','Salário, pró-labore, 13º, férias e comissões.'],'Extra':['⚡','Bicos, freelas, vendas e rendas ocasionais.'],'Investimentos':['📈','Rendimentos, dividendos, juros e resgates.'],'Outros':['📦','Reembolsos, presentes e outras entradas.']}};
const PAY=[['Dinheiro','💵'],['Pix','⚡'],['Débito','💳'],['Crédito','💳'],['Boleto','🧾'],['Transferência','🔁']];
let ftype='e',fcat='',fpay='Dinheiro';
const hint=(k,c)=>{const b=HINT[k][c]||['🏷️','Categoria personalizada.'],h=(S.hints||{})[k+'|'+c];return h?[b[0],h]:b};
function openForm(id){
 const t=id?S.tx.find(x=>x.id==id):null;ftype=t?t.t:'e';
 window._id=id||null;fcat=t?t.c:'';fpay=t&&t.p?t.p:'Dinheiro';
 $('#dlg').innerHTML=`<div class="hd"></div><div class="sh"><div class="seg"><button id="be" onclick="setT('e')">Despesa</button><button id="br" onclick="setT('r')">Receita</button></div>
 <div class="amt"><span>R$</span><input id="fv" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0,00" value="${t?t.v:''}"></div>
 <label>Descrição</label><input id="fn" placeholder="Ex.: Supermercado" value="${t?esc(t.n):''}">
 <label>Categoria</label><div class="chips" id="fc"></div><div class="tip" id="tip"></div>
 <label>Data</label><input id="fd" type="date" value="${t?t.d:new Date().toISOString().slice(0,10)}">
 <label>Forma de pagamento</label><div class="chips" id="fp"></div></div>
 <div class="ft"><button class="btn g" onclick="$('#dlg').close()">Cancelar</button><button class="btn" onclick="saveTx()">Salvar</button></div>`;
 setT(ftype);setP(fpay);$('#dlg').showModal();
}
function setT(k){ftype=k;$('#be').className=k=='e'?'on e':'';$('#br').className=k=='r'?'on r':'';
 if(!S.cats[k].includes(fcat))fcat=S.cats[k][0]||'';
 setC(fcat)}
function setC(c){fcat=c;$('#fc').innerHTML=S.cats[ftype].map(x=>`<button class="chip ${x==c?'on':''}" onclick="setC(this.dataset.c)" data-c="${esc(x)}">${hint(ftype,x)[0]} ${esc(x)}</button>`).join('');
 $('#tip').innerHTML=`<b>${hint(ftype,c)[0]} ${esc(c)}</b><br>${hint(ftype,c)[1]}`}
function setP(p){fpay=p;$('#fp').innerHTML=PAY.map(x=>`<button class="chip ${x[0]==p?'on':''}" onclick="setP('${x[0]}')">${x[1]} ${x[0]}</button>`).join('')}
function saveTx(){
 const v=parseFloat($('#fv').value),d=$('#fd').value;
 if(!(v>0)||!d){alert('Informe um valor válido e a data.');return}
 const o={t:ftype,v,n:$('#fn').value.trim(),c:fcat,d,p:fpay};
 if(window._id)Object.assign(S.tx.find(x=>x.id==window._id),o);else S.tx.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),...o});
 save();mon=d.slice(0,7);$('#dlg').close();render();
}
function del(id){if(confirm('Excluir este lançamento?')){S.tx=S.tx.filter(x=>x.id!=id);save();render()}}
function reset(){if(confirm('Apagar TODOS os dados? Esta ação não pode ser desfeita.')){S=def();save();render()}}

function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
function exportJSON(){dl('financeiro_backup.json',JSON.stringify(S,null,1),'application/json')}
function exportCSV(){const L=['Data;Tipo;Categoria;Descrição;Pagamento;Valor'];[...S.tx].sort((a,b)=>a.d.localeCompare(b.d)).forEach(t=>L.push([t.d,t.t=='r'?'Receita':'Despesa',t.c,'"'+(t.n||'').replace(/"/g,'""')+'"',t.p||'',t.v.toFixed(2).replace('.',',')].join(';')));dl('lancamentos.csv','\ufeff'+L.join('\n'),'text/csv')}
$('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.tx||!d.cats)throw 0;S=d;save();render();alert('Backup importado.')}catch(x){alert('Arquivo inválido.')}};r.readAsText(f);e.target.value=''};
const KW=[[/mercado|supermerc|super|big b|minim|market|churr|padaria|ifood|restaur|lanch|a[cç]ougue|hortifruti|atacad/i,'Alimentação'],[/uber|99 ?pop|autop|posto|combust|shell|ipiranga|estacion|ped[aá]gio|sem parar/i,'Transporte'],[/farm[aá]c|drog|raia|clini|hospital|unimed|cl[ií]nica|laborat/i,'Saúde'],[/netflix|spotify|cinema|prime|disney|youtube|viagem/i,'Lazer'],[/escola|curso|faculdade|udemy|livraria|universid|educacao/i,'Educação'],[/cpfl|enel|energia/i,'Energia'],[/sabesp|[aá]gua|vivo|claro|internet|samae|telefonica|teleco|seguradora/i,'Contas'],[/aluguel|condom[ií]nio|iptu/i,'Moradia'],[/fatura|cartoes|cart[aã]o/i,'Cartão de Crédito']];
const KWR=[[/sal[aá]rio|folha|pagamento/i,'Salário'],[/rendimento|dividend|juros|resgate/i,'Investimentos']];
const guess=(n,t)=>{const c=(t=='e'?KW:KWR).find(k=>k[0].test(n));const cat=c?c[1]:'Outros';return S.cats[t].includes(cat)?cat:(S.cats[t].includes('Outros')?'Outros':S.cats[t][0])};
let IM={rows:[],mode:'b'};
const pd=s=>{s=String(s||'');let m=s.match(/(\d{2})\/(\d{2})\/(\d{4})/);if(m)return m[3]+'-'+m[2]+'-'+m[1];m=s.match(/(\d{4})-(\d{2})-(\d{2})/);return m?m[0]:null};
const pn=s=>{s=String(s||'').replace(/R\$|\s/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)};
function parseExt(txt){
 const rows=[];
 if(/<STMTTRN>/i.test(txt)){
  txt.split(/<STMTTRN>/i).slice(1).forEach(b=>{const g=t=>(b.match(new RegExp('<'+t+'>([^<\\r\\n]*)','i'))||[])[1]||'';const s=g('DTPOSTED');rows.push({d:s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8),raw:parseFloat(g('TRNAMT').replace(',','.')),n:(g('MEMO')||g('NAME')).trim()})});
 }else{
  const L=txt.split(/\r?\n/).filter(l=>l.trim()),s=L[0].split(';').length>L[0].split(',').length?';':',';
  const sp=(l)=>{const o=[];let c='',q=0;for(const ch of l){if(ch=='"')q=!q;else if(ch==s&&!q){o.push(c);c=''}else c+=ch}o.push(c);return o.map(x=>x.trim())};
  const H=sp(L[0]).map(x=>x.toLowerCase());
  let di=H.findIndex(x=>/data|date/.test(x)),ni=H.findIndex(x=>/descri|hist|lan[cç]|title|memo|estabel/.test(x)),vi=H.findIndex(x=>/valor|amount|value/.test(x));
  const hh=di>=0&&vi>=0;if(!hh){di=0;ni=1;vi=H.length-1}else if(ni<0)ni=di==0?1:0;
  L.slice(hh?1:0).forEach(l=>{const c=sp(l);rows.push({d:pd(c[di]),raw:pn(c[vi]),n:c[ni]||''})});
 }
 return rows.filter(r=>r.d&&isFinite(r.raw)&&r.raw!=0);
}
function parseStmt(t){const re=/(\d{2}\/\d{2}\/\d{4})\s+((?:(?!\d{2}\/\d{2}\/\d{4}).)+?)\s+(-?\d{1,3}(?:\.\d{3})*,\d{2})(?=$|\D|\d{2}\/\d{2}\/\d{4})/g,rows=[];let m;while(m=re.exec(t))rows.push({d:pd(m[1]),n:m[2].replace(/\s*\d{2}\/\d{2}$/,'').trim(),raw:pn(m[3])});return rows}
function loadJS(u){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function pdfText(buf){
 const B='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
 if(!window.pdfjsLib){await loadJS(B+'pdf.min.js');await loadJS(B+'pdf.worker.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc=B+'pdf.worker.min.js'}
 const pdf=await pdfjsLib.getDocument({data:buf}).promise;let out='';
 for(let p=1;p<=pdf.numPages;p++){const tc=await(await pdf.getPage(p)).getTextContent(),ls={};tc.items.forEach(i=>{const y=Math.round(i.transform[5]/4);(ls[y]=ls[y]||[]).push(i)});
  Object.keys(ls).map(Number).sort((a,b)=>b-a).forEach(y=>{out+=ls[y].sort((a,b)=>a.transform[4]-b.transform[4]).map(i=>i.str).join(' ')+'\n'})}
 return out}
function impCalc(){const ex=new Set(S.tx.map(x=>[x.d,x.v.toFixed(2),x.t,(x.n||'').toLowerCase()].join('|')));IM.rows.forEach(r=>{r.t=(IM.mode=='b'?r.raw<0:r.raw>0)?'e':'r';r.v=Math.abs(r.raw);r.c=guess(r.n,r.t);r.dup=ex.has([r.d,r.v.toFixed(2),r.t,r.n.toLowerCase()].join('|'));r.ok=!r.dup})}
function impRender(k){if(!k)impCalc();const R=IM.rows;
 $('#dlg').innerHTML=`<div class="hd"></div><div class="sh"><h2>Importar extrato (${R.length})</h2>
 <label>Como interpretar os valores</label><select onchange="IM.mode=this.value;impRender()"><option value="b" ${IM.mode=='b'?'selected':''}>Negativo = despesa (extrato do banco)</option><option value="c" ${IM.mode=='c'?'selected':''}>Positivo = despesa (fatura do cartão)</option></select>
 <p class="mut" style="font-size:13px">Categorias sugeridas automaticamente; você pode editar depois. Lançamentos parecidos com os já existentes vêm desmarcados.</p>
 <div class="chips" style="margin-bottom:6px"><button class="chip" onclick="IM.rows.forEach(r=>r.ok=true);impRender(1)">Marcar todos</button><button class="chip" onclick="IM.rows.forEach(r=>r.ok=false);impRender(1)">Desmarcar todos</button></div><div>${R.map((r,i)=>`<div class="tx"><input type="checkbox" style="width:22px;height:22px;flex:none;padding:0" ${r.ok?'checked':''} onchange="IM.rows[${i}].ok=this.checked;impSum()"><div class="i"><b>${esc(r.n||'(sem descrição)')}</b><small class="mut">${fd(r.d)} · ${esc(r.c)}${r.dup?' · ⚠️ já lançado?':''}</small></div><span class="v ${r.t=='r'?'ok':'bad'}">${r.t=='r'?'+':'-'}${brl(r.v)}</span></div>`).join('')}</div></div>
 <div class="ft"><button class="btn g" onclick="$('#dlg').close()">Cancelar</button><button class="btn" id="impb" onclick="impDo()"></button></div>`;impSum()}
function impSum(){$('#impb').textContent='Importar '+IM.rows.filter(r=>r.ok).length}
function impDo(){const sel=IM.rows.filter(r=>r.ok);if(!sel.length)return;sel.forEach(r=>S.tx.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),t:r.t,v:r.v,n:r.n,c:r.c,d:r.d,p:IM.mode=='c'?'Crédito':'Débito'}));save();mon=sel.map(r=>r.d).sort().pop().slice(0,7);$('#dlg').close();render()}
$('#ext').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const buf=await f.arrayBuffer();let rows=[];try{if(/\.pdf$/i.test(f.name)){rows=parseStmt(await pdfText(buf))}else{let txt;try{txt=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(x){txt=new TextDecoder('windows-1252').decode(buf)}const tt=/\.txt$/i.test(f.name);rows=tt?parseStmt(txt):parseExt(txt);if(!rows.length)rows=tt?parseExt(txt):parseStmt(txt)}}catch(x){alert('Não consegui ler o PDF (é preciso internet para carregar o leitor). Tente exportar em CSV/OFX ou salvar o texto do extrato em um arquivo .txt.');return}if(!rows.length){alert('Não encontrei lançamentos neste arquivo. Use um extrato em PDF, CSV ou OFX.');return}IM={rows,mode:'b'};impRender();$('#dlg').showModal()};
$('#dlg').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close()});
$('#dlg').addEventListener('focusin',e=>{if(e.target.matches('input'))setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),350)});
if(window.visualViewport){const vv=visualViewport,f=()=>{const d=$('#dlg'),kb=innerHeight-vv.height-vv.offsetTop;d.style.maxHeight=kb>80?Math.round(vv.height*.96)+'px':'';d.style.marginBottom=kb>80?kb+'px':''};vv.addEventListener('resize',f);vv.addEventListener('scroll',f)}
render();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</body>
</html>
